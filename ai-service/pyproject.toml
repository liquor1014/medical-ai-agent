[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-service"
version = "0.1.0"
description = "医疗文件检索与报表统计 Agent - Python AI 编排服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "minio>=7.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "tenacity>=9.0",
    "openai>=1.40",
]

[project.optional-dependencies]
rag = [
    "docling>=2.0",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.3",
    "rank-bm25>=0.2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
