server:
  port: 8080

spring:
  application:
    name: medical-ai-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medical_ai}
    username: ${POSTGRES_USER:medical}
    password: ${POSTGRES_PASSWORD:medical123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 3000
      initialization-fail-timeout: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  mail:
    # 留空表示未配置 SMTP，找回密码自动降级为演示模式（验证码随响应返回）
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:no-reply@medical-ai.local}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          ssl:
            enable: ${SMTP_SSL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # 未配置 SMTP 时不做邮件连通性探测，避免健康检查误判为 DOWN
    mail:
      enabled: false

app:
  tenant:
    header: X-Tenant-Id
    default-tenant: hospital-demo
  auth:
    jwt:
      secret: ${JWT_SECRET:medical-ai-dev-only-jwt-signing-secret-change-me-in-production-2026}
      expire-hours: ${JWT_EXPIRE_HOURS:12}
    session:
      prefix: "auth:session:"
      user-prefix: "auth:user-sessions:"
    password:
      # 密码复杂度：长度 + 字符类别（大写/小写/数字/特殊字符）
      min-length: ${PASSWORD_MIN_LENGTH:8}
      max-length: ${PASSWORD_MAX_LENGTH:64}
      min-classes: ${PASSWORD_MIN_CLASSES:3}
    login:
      # 连续登录失败达到阈值后锁定账号
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    reset:
      # 验证码有效期 / 重置凭证有效期 / 发送间隔 / 每日上限
      code-ttl-seconds: ${RESET_CODE_TTL_SECONDS:300}
      ticket-ttl-seconds: ${RESET_TICKET_TTL_SECONDS:600}
      interval-seconds: ${RESET_INTERVAL_SECONDS:60}
      daily-limit: ${RESET_DAILY_LIMIT:10}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:medical-docs}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.medicalai: INFO
  file:
    name: logs/backend.log
