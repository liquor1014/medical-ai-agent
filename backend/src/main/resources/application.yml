server:
  port: 8080

spring:
  application:
    name: medical-ai-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medical_ai}
    username: ${POSTGRES_USER:medical}
    password: ${POSTGRES_PASSWORD:medical123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 3000
      initialization-fail-timeout: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  tenant:
    header: X-Tenant-Id
    default-tenant: hospital-demo
  auth:
    jwt:
      secret: ${JWT_SECRET:medical-ai-dev-only-jwt-signing-secret-change-me-in-production-2026}
      expire-hours: ${JWT_EXPIRE_HOURS:12}
    session:
      prefix: "auth:session:"
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:medical-docs}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.medicalai: INFO
  file:
    name: logs/backend.log
