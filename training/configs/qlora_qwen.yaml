# QLoRA 小实验配置（LLaMA-Factory）
# 仅做输出格式 / 术语 / SQL 方言对齐，事实知识交给 RAG

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### quantization
quantization_bit: 4

### dataset
dataset: medical_spd_sft
template: qwen
cutoff_len: 2048
max_samples: 3000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: training/output/qwen2.5-7b-qlora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true

### eval
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 200
