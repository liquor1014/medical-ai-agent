# 医疗文件检索与报表统计 Agent — 全栈一键启动
# 开发只用基础设施：docker compose -f infra/docker-compose.yml up -d
# 一键启动（Windows）：.\scripts\start.ps1
# 一键启动（macOS/Linux）：bash scripts/start.sh

name: medical-ai-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========== 基础设施 ==========
  postgres:
    image: postgres:16
    container_name: medical-ai-postgres
    environment:
      POSTGRES_DB: medical_ai
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/migrations/002_model_call_log.sql:/docker-entrypoint-initdb.d/02-model-call-log.sql:ro
      - ./infra/migrations/003_app_user.sql:/docker-entrypoint-initdb.d/03-app-user.sql:ro
      - ./infra/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d medical_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: medical-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medical-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: medical-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # 首次启动自动创建文档 bucket（幂等）
  # 复用 minio/minio 镜像内置的 mc 客户端，避免额外拉取 minio/mc 镜像
  minio-init:
    image: minio/minio:latest
    container_name: medical-ai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/medical-docs
    restart: "no"

  # ========== 业务服务 ==========
  backend:
    build:
      context: ./backend
    image: medical-ai/backend:0.1.0
    container_name: medical-ai-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medical_ai
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical123
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: medical-docs
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-medical-ai-dev-only-jwt-signing-secret-change-me-in-production-2026}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-12}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging

  ai-service:
    build:
      context: ./ai-service
    image: medical-ai/ai-service:0.1.0
    container_name: medical-ai-ai-service
    environment:
      APP_ENV: docker
      POSTGRES_DSN: postgresql://medical:medical123@postgres:5432/medical_ai
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: medical_docs
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: medical-docs
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_ROUTE_CHAT: ${LLM_ROUTE_CHAT:-deepseek,qwen,openai,mock}
      LLM_ROUTE_NL2SQL: ${LLM_ROUTE_NL2SQL:-deepseek,qwen,openai,mock}
      LLM_ROUTE_REPORT: ${LLM_ROUTE_REPORT:-deepseek,qwen,openai,mock}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_STREAM_IDLE_TIMEOUT: ${LLM_STREAM_IDLE_TIMEOUT:-15}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ./web
    image: medical-ai/web:0.1.0
    container_name: medical-ai-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  minio_data:
